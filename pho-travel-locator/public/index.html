<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Travel & Activity Locator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4/bootstrap-4.css" rel="stylesheet">

  <style>
    :root { --g200: #bce2cd; }

    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #f1f7f4 0%, #bce2cd 100%);
      z-index: 9999; display: flex; flex-direction: column;
      justify-content: center; align-items: center; overflow: hidden;
      transition: opacity 0.6s ease-out, visibility 0.6s;
    }

    .logo-frame {
      position: relative; border-radius: 50%; padding: 20px; margin-bottom: 25px;
      width: 200px; height: 200px; display: flex; align-items: center; justify-content: center;
    }
    .logo-frame::before {
      content: ''; position: absolute; inset: -10px; border-radius: 50%;
      border: 8px solid rgba(0, 127, 78, 0.15);
      border-top-color: #007f4e;
      animation: spinRing 1.1s linear infinite;
    }
    @keyframes spinRing { to { transform: rotate(360deg); } }

    .splash-logo { max-height: 200px; max-width: 200px; object-fit: contain; }
    .splash-text {
      color: #1b3d26; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(255,255,255,0.4);
    }
    .splash-sub { color: #385a44; font-weight: 600; letter-spacing: 0.5px; }

    .waves-container {
      position: absolute; bottom: 0; left: 0; width: 100%;
      height: 15vh; min-height: 100px; max-height: 150px;
      overflow: hidden; pointer-events: none;
    }
    .waves { position: relative; width: 100%; height: 100%; margin-bottom: -7px; }
    .parallax > use { animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite; }
    .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
    .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
    .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
    .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }
    @keyframes move-forever {
      0% { transform: translate3d(-90px,0,0); }
      100% { transform: translate3d(85px,0,0); }
    }

    body { background-color: #f1f7f4; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-custom {
      border: none; border-radius: 16px;
      box-shadow: 0 12px 36px rgba(46, 91, 71, 0.08); background-color: #ffffff;
    }
    .card-header-custom {
      background-color: #007f4e; border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      border-top-left-radius: 16px !important; border-top-right-radius: 16px !important;
      position: relative;
    }
    .logo-badge-container { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .header-logo { max-height: 85px; max-width: 85px; object-fit: contain; }
    .header-text-container {
      display: flex; flex-direction: column; justify-content: center;
      border-left: 1px solid rgba(255, 255, 255, 0.15); padding-left: 16px;
    }
    .header-agency {
      font-size: 0.70rem; font-weight: 600; color: #9fc7ac;
      letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 3px;
    }
    .header-title { color: #ffffff; font-weight: 700; font-size: 1.25rem !important; letter-spacing: 0.2px; margin: 0; line-height: 1.25; }
    .header-subtitle { color: #b9d4c2; font-size: 0.78rem; font-weight: 400; letter-spacing: 0.1px; margin-top: 3px; }
    .form-label { color: #385a44; font-weight: 600; font-size: 1em; }
    .form-control:focus { border-color: #3b8855; box-shadow: 0 0 0 0.25rem rgba(59, 136, 85, 0.15); }
    .form-control:read-only { background-color: #f8f9fa; color: #6c757d; }
    .btn-green { background-color: #007f4e; color: white; font-weight: 600; border: none; padding: 12px; transition: background-color 0.2s ease; }
    .btn-green:hover { background-color: #005c38; color: white; }
    .char-counter { text-align: right; color: #6c757d; }
    .char-counter.text-warning { color: #c98a00 !important; }
    .char-counter.text-danger { color: #d33 !important; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-3 py-md-5">

  <div id="splash-screen">
    <div class="logo-frame">
      <img src="https://lh3.googleusercontent.com/d/18eRw-6rMaaVYJhxR7ZR7-m-BIy6VujDl" alt="PHO Logo" class="splash-logo">
    </div>

    <div class="splash-text fs-2 text-center px-3">PHO TRAVEL LOCATOR</div>
    <div class="splash-sub small mt-1">LOG ACTIVITY & MOVEMENT SCHEDULES</div>

    <div class="waves-container">
      <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
           viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
        <defs>
          <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
        </defs>
        <g class="parallax">
          <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(168, 223, 168, 0.3)" />
          <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(168, 223, 168, 0.5)" />
          <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(168, 223, 168, 0.7)" />
          <use xlink:href="#gentle-wave" x="48" y="7" fill="var(--g200)" />
        </g>
      </svg>
    </div>
  </div>

  <div class="container px-2 px-sm-3 px-md-0" style="z-index: 5;">
    <div class="row justify-content-center mx-0">
      <div class="col-12 col-md-8 col-lg-6 px-1">

        <div class="card card-custom">
          <div class="card-header-custom p-3 px-4 d-flex align-items-center gap-3">
            <div class="logo-badge-container">
              <img src="https://lh3.googleusercontent.com/d/18eRw-6rMaaVYJhxR7ZR7-m-BIy6VujDl" alt="Logo" class="header-logo">
            </div>
            <div class="header-text-container">
              <div class="header-agency">PROVINCIAL HEALTH OFFICE</div>
              <h1 class="header-title fs-4">PHO Travel Locator Form</h1>
              <div class="header-subtitle">Employee Activity & Movement Log</div>
            </div>
          </div>

          <div class="card-body p-4">
            <form id="locatorForm" novalidate>

              <div class="mb-3">
                <label class="form-label small" for="employeeId">Employee ID</label>
                <input type="text" id="employeeId" name="employeeId" required autocomplete="off" class="form-control" placeholder="e.g. 2026001">
                <div id="lookupStatus" class="form-text small"></div>
              </div>

              <div class="mb-3">
                <label class="form-label small" for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required readonly class="form-control" placeholder="Please Enter Employee ID Above">
              </div>

              <div class="mb-3">
                <label class="form-label small" for="designation">Designation / Role</label>
                <input type="text" id="designation" name="designation" required readonly class="form-control" placeholder="Please Enter Employee ID Above">
              </div>

              <div class="mb-3">
                <label class="form-label small" for="activity">Name of Activity</label>
                <input type="text" id="activity" name="activity" required maxlength="45" class="form-control" placeholder="e.g. FHSIS MOP Orientation">
                <div class="form-text small char-counter"><span id="activityCount">0</span>/45</div>
              </div>

              <div class="mb-3">
                <label class="form-label small" for="venue">Venue / Destination</label>
                <input type="text" id="venue" name="venue" required maxlength="45" class="form-control" placeholder="e.g. PHO Conference Room">
                <div class="form-text small char-counter"><span id="venueCount">0</span>/45</div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-12 col-sm-6">
                  <label class="form-label small" for="startTravel">Start of Travel</label>
                  <input type="date" id="startTravel" name="startTravel" required class="form-control">
                </div>
                <div class="col-12 col-sm-6">
                  <label class="form-label small" for="endTravel">End of Travel</label>
                  <input type="date" id="endTravel" name="endTravel" required class="form-control">
                </div>
              </div>

              <button type="submit" id="submitBtn" class="btn btn-green w-100 rounded-3">Submit Travel Log</button>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    const form = document.getElementById('locatorForm');
    const idInput = document.getElementById('employeeId');
    const nameInput = document.getElementById('fullName');
    const roleInput = document.getElementById('designation');
    const statusDiv = document.getElementById('lookupStatus');
    const startInput = document.getElementById('startTravel');
    const endInput = document.getElementById('endTravel');
    const submitBtn = document.getElementById('submitBtn');

    // ---- Splash ----
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        splash.style.visibility = 'hidden';
      }, 2000);
    });

    // ---- Character counters ----
    function updateCharCount(input, counterId) {
      const counterSpan = document.getElementById(counterId);
      const len = input.value.length;
      counterSpan.innerText = len;
      const wrapper = counterSpan.closest('.char-counter');
      wrapper.classList.remove('text-warning', 'text-danger');
      if (len >= 45) wrapper.classList.add('text-danger');
      else if (len >= 24) wrapper.classList.add('text-warning');
    }
    document.getElementById('activity').addEventListener('input', (e) => updateCharCount(e.target, 'activityCount'));
    document.getElementById('venue').addEventListener('input', (e) => updateCharCount(e.target, 'venueCount'));

    // ---- Keep End >= Start ----
    startInput.addEventListener('change', () => {
      endInput.min = startInput.value;
      if (endInput.value && endInput.value < startInput.value) endInput.value = startInput.value;
    });

    // ---- Small fetch helper ----
    async function api(url, options) {
      const res = await fetch(url, options);
      let data = null;
      try { data = await res.json(); } catch (_) { /* non-JSON error page */ }
      if (!data) throw new Error('Bad response (' + res.status + ')');
      return data;
    }

    // ---- Employee lookup ----
    let lookupToken = 0; // ignore out-of-order responses

    function clearEmployee() {
      nameInput.value = '';
      roleInput.value = '';
    }

    async function checkEmployeeId(idValue) {
      const id = idValue.trim();
      if (!id) {
        lookupToken++;
        clearEmployee();
        statusDiv.innerHTML = '';
        return;
      }

      const myToken = ++lookupToken;
      statusDiv.innerHTML = '<span class="text-primary">Searching Employee IDs…</span>';

      try {
        const result = await api('/api/lookup?id=' + encodeURIComponent(id));
        if (myToken !== lookupToken) return;

        if (result.success) {
          nameInput.value = result.fullName;
          roleInput.value = result.designation;
          statusDiv.innerHTML = '<span class="text-success">✓ Employee ID found and verified</span>';
        } else {
          clearEmployee();
          statusDiv.innerHTML = '<span class="text-danger">✗ Invalid Employee ID</span>';
          Swal.fire({
            title: 'Employee ID Not Found',
            text: 'We couldn\'t find that Employee ID in our records.',
            icon: 'warning',
            confirmButtonColor: '#007f4e'
          });
        }
      } catch (err) {
        if (myToken !== lookupToken) return;
        clearEmployee();
        statusDiv.innerHTML = '<span class="text-danger">Lookup failed. Please try again.</span>';
      }
    }
    idInput.addEventListener('change', () => checkEmployeeId(idInput.value));

    // ---- Submit ----
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!form.reportValidity()) return;
      if (!nameInput.value) {
        Swal.fire({
          title: 'Employee Not Verified',
          text: 'Please enter a valid Employee ID first.',
          icon: 'warning',
          confirmButtonColor: '#007f4e'
        });
        return;
      }
      if (endInput.value < startInput.value) {
        Swal.fire({
          title: 'Check Your Dates',
          text: 'End of Travel cannot be earlier than Start of Travel.',
          icon: 'warning',
          confirmButtonColor: '#007f4e'
        });
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Processing entry…';

      const payload = {
        employeeId: idInput.value.trim(),
        activity: document.getElementById('activity').value,
        venue: document.getElementById('venue').value,
        startTravel: startInput.value,
        endTravel: endInput.value
      };

      try {
        const response = await api('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.success) {
          Swal.fire({
            title: 'Travel Submitted!',
            text: 'Your travel itinerary has been recorded successfully.',
            icon: 'success',
            confirmButtonColor: '#007f4e'
          });
          form.reset();
          endInput.removeAttribute('min');
          statusDiv.innerHTML = '';
          document.getElementById('activityCount').innerText = '0';
          document.getElementById('venueCount').innerText = '0';
          document.querySelectorAll('.char-counter').forEach(c => c.classList.remove('text-warning', 'text-danger'));
        } else {
          Swal.fire({
            title: 'Submission Failed',
            text: response.message || 'Something went wrong.',
            icon: 'error',
            confirmButtonColor: '#d33'
          });
        }
      } catch (err) {
        Swal.fire({
          title: 'Network Error',
          text: 'Could not connect to the server. Please try again.',
          icon: 'error',
          confirmButtonColor: '#d33'
        });
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Travel Log';
      }
    });
  </script>
</body>
</html>
